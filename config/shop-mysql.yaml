connections:
  - name: shop-mysql
    type: mysql2
    host: 127.0.0.1
    port: 3306
    database: shop
    username: root
    passwordRef: ${MYSQL_LIVE_PASSWORD}
    aliases:
      - shop

pool:
  max: 10
  min: 1
  idleTimeout: 30000

limits:
  max_rows: 1000
  timeout: 30
  result_size: 5
  max_execution_time: 60

audit:
  enabled: true

credential:
  provider: env

default_connection: shop-mysql
